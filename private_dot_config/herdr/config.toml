onboarding = false

[theme]
name = "terminal"

[terminal]
new_cwd = "follow"
kitty_graphics = true

[server]
headless_cols = 140
headless_rows = 45

[keys]
prefix = "ctrl+b"
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
new_tab = ["prefix+c", "ctrl+alt+c"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
split_vertical = ["prefix+v", "ctrl+alt+v"]
split_horizontal = ["prefix+minus", "ctrl+alt+minus"]
zoom = ["prefix+z", "ctrl+alt+z"]
toggle_sidebar = ["prefix+b", "ctrl+alt+b"]

[ui]
agent_panel_sort = "priority"
status_indicators = "symbols"
mouse_capture = true
copy_on_select = true
window_title = "{hostname}: {workspace}"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "$HOME/.local/bin/oc-quota", interval_seconds = 300, timeout_seconds = 20 },
  { type = "datetime", format = "%H:%M" },
]
tab_bar_right_separator = " · "

[ui.toast]
delivery = "herdr"

[experimental]
pane_history = true
